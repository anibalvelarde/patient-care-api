replicaCount: 1

image:
  repository: anibalvelarde/patient-care-api
  tag: "latest"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 5245
  nodePort: 30000

namespace: nc-k3s

database:
  host: ""
  port: "3306"
  name: ""
  user: ""
  password: ""

# HMAC-SHA256 signing key for JWT access/refresh tokens. Required (no default) — the API fails
# fast outside Development if it is unset. Provide via --set jwt.signingKey=... or the deploy
# scripts (which read JWT_SIGNING_KEY from .env). Never commit a real key. Generate: openssl rand -base64 48
jwt:
  signingKey: ""

healthCheck:
  liveness:
    path: /api/health/live
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /api/health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
  startup:
    path: /api/health/startup
    failureThreshold: 30
    periodSeconds: 5
