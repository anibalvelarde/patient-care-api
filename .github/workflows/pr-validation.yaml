name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./patient-care-api.sln

    - name: Build
      run: dotnet build ./patient-care-api.sln --no-restore

    - name: Run tests
      run: dotnet test ./patient-care-api.sln --no-build

    # WP-17D: access-control drift tripwire. The conformance tests above already
    # assert anchor==manifest and constants==manifest set; this adds byte-identity
    # by regenerating Permissions.g.cs from the vendored manifest and failing on diff.
    # Cross-repo reconciliation against the canonical super manifest runs in patient-care-super.
    - name: Access-control codegen drift check
      run: bash tools/generate-permissions.sh --check
